name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install testing and security tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 bandit

      - name: Code quality check
        run: flake8 hello.py

      - name: Security scan
        run: bandit hello.py

      - name: Build check
        run: python -m py_compile hello.py

      - name: Run application test
        run: |
          python hello.py
          python hello.py | grep "CI/CD pipeline test successful."
